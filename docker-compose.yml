# SolarERP local / CI stack (B12 "Local" environment).
# Usage: cp .env.example .env && docker compose up --build
name: solar-erp

x-app-env: &app-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DATABASE: ${MYSQL_DATABASE:-solarerp}
  MYSQL_USER: ${MYSQL_USER:-solarerp}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  S3_ENDPOINT: http://s3:8333
  S3_ACCESS_KEY: solarerp
  S3_SECRET_KEY: change-me-s3
  GOTENBERG_URL: http://gotenberg:3000
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solarerp}
      MYSQL_USER: ${MYSQL_USER:-solarerp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  flyway:
    image: flyway/flyway:11
    command: -connectRetries=30 migrate
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-solarerp}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for local use (MinIO images are no longer published).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - s3-data:/data
      - ./infra/local/s3.json:/etc/seaweedfs/s3.json:ro

  gotenberg:
    image: gotenberg/gotenberg:8

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-env
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  s3-data:
